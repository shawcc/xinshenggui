name: Build macOS installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
          - name: Intel
            runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Configure Apple notarization
        if: ${{ env.APPLE_API_KEY_CONTENT != '' }}
        run: |
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Install application and audio dependencies
        run: |
          npm ci
          npm run setup:demucs

      - name: Verify media processing and first-run model download
        run: RUN_DEMUCS_TEST=1 npm test

      - name: Verify the bundled Demucs runtime is relocatable
        run: |
          mkdir "$RUNNER_TEMP/demucs-bundle"
          mv .demucs-runtime.json .python-demucs .venv-demucs "$RUNNER_TEMP/demucs-bundle/"
          DEMUCS_ROOT="$RUNNER_TEMP/demucs-bundle" RUN_DEMUCS_TEST=1 npm test
          mv "$RUNNER_TEMP/demucs-bundle"/.demucs-runtime.json .
          mv "$RUNNER_TEMP/demucs-bundle"/.python-demucs .
          mv "$RUNNER_TEMP/demucs-bundle"/.venv-demucs .

      - name: Build DMG
        run: npm run desktop:mac -- --${{ matrix.arch }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: xinshenggui-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: xinshenggui-macos-*
          merge-multiple: true
          path: release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.dmg
